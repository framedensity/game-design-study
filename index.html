<body>
  <!--
    メニューは5つ。data-views に並べた画面のどれかを開いている時、そのメニューが光る。
    画面を足した時は、ここの data-views にも足す（上のメニューと、下のタブの両方）。
  -->
  <header class="site-header">
    <div class="header-row">
      <h1 class="site-title">ゲーム<ruby>設計<rt>せっけい</rt></ruby> 学習帳</h1>
      <button id="ruby-toggle" class="toggle" type="button" aria-pressed="true">ふりがな：あり</button>
    </div>
    <nav class="site-nav" aria-label="メニュー">
      <a href="#quiz" data-views="quiz review">今日の学習</a>
      <a href="#practice" data-views="practice verbal breakdown rules problems playtest"><ruby>練習<rt>れんしゅう</rt></ruby></a>

  <main id="app" class="container"></main>

    <a href="#practice" data-views="practice verbal breakdown rules problems playtest">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg>
      <span>練習</span>
    </a>
    <a href="#project" data-views="project doc kikaku">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h10l3 3v15H6zM9 9h7M9 13h7M9 17h4"/></svg>
      <span>企画ノート</span>
    </a>
    <a href="#read" data-views="read glossary sakurai library">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5c3-1 6-1 9 1 3-2 6-2 9-1v14c-3-1-6-1-9 1-3-2-6-2-9-1zM12 6v14"/></svg>

    </a>
    <a href="#progress" data-views="progress">
