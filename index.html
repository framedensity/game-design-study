<!doctype html>
<html lang="ja">
<head>

  <title>ゲーム設計 学習帳</title>

<body>

    <div class="header-row">
      <h1 class="site-title">ゲーム<ruby>設計<rt>せっけい</rt></ruby> 学習帳</h1>
      <button id="ruby-toggle" class="toggle" type="button" aria-pressed="true">ふりがな：あり</button>
    </div>
    <nav class="site-nav" aria-label="メニュー">
      <a href="#quiz" data-view="quiz">今日の学習</a>
      <a href="#review" data-view="review"><ruby>復習<rt>ふくしゅう</rt></ruby></a>
      <a href="#progress" data-view="progress"><ruby>進捗<rt>しんちょく</rt></ruby></a>

      <span class="nav-soon" title="準備中">ゲーム<ruby>分解<rt>ぶんかい</rt></ruby></span>
      <span class="nav-soon" title="準備中">ルール<ruby>変更<rt>へんこう</rt></ruby></span>
      <span class="nav-soon" title="準備中"><ruby>課題<rt>かだい</rt></ruby>と<ruby>解決<rt>かいけつ</rt></ruby></span>
      <span class="nav-soon" title="準備中"><ruby>資料<rt>しりょう</rt></ruby></span>
    </nav>
  </header>

  <main id="app" class="container"></main>

  <!-- スマホ用の、画面下のタブ（幅が狭い時だけ表示） -->
  <nav class="tabbar" aria-label="タブ">
    <a href="#quiz" data-view="quiz">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>今日の学習</span>
    </a>
    <a href="#review" data-view="review">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg>
      <span>復習</span>
    </a>
    <a href="#progress" data-view="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M12 20V6M19 20v-9"/></svg>
      <span>進捗</span>
    </a>
  </nav>

  <!-- 教材データ（コードとは分けて管理） -->

  <script src="data/tips.js"></script>
  <!-- 機能（この順番で読み込む） -->
